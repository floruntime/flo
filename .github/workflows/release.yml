name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
      publish:
        description: 'Create the GitHub release. Off: build and package only'
        type: boolean
        default: true

permissions:
  contents: write

env:
  ZIG_VERSION: "0.17.0"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            platform: linux
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: linux
            target: aarch64-linux
          - os: macos-15
            arch: x86_64
            platform: macos
            target: x86_64-macos
          - os: macos-15
            arch: aarch64
            platform: macos
            target: aarch64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web dashboard
        run: |
          cd web && npm ci && npm run build
          rm -rf ../src/node/dashboard/dist
          mkdir -p ../src/node/dashboard/dist
          cp -r dist/* ../src/node/dashboard/dist/

      - name: Determine version
        id: version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG=$TAG_INPUT; else TAG=${GITHUB_REF#refs/tags/}; fi
          if [[ ! $TAG =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: zig build --release=safe -Dtarget="$TARGET" -Dversion="$VERSION"

      - name: Package
        env:
          ARTIFACT: flo-${{ matrix.arch }}-${{ matrix.platform }}
        run: |
          cp zig-out/bin/flo flo
          tar -czf "${ARTIFACT}.tar.gz" flo
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          else
            shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flo-${{ matrix.arch }}-${{ matrix.platform }}
          path: |
            flo-*.tar.gz
            flo-*.tar.gz.sha256

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag
        id: tag
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG=$TAG_INPUT; else TAG=${GITHUB_REF#refs/tags/}; fi
          if [[ ! $TAG =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Flo ${{ steps.tag.outputs.TAG }}
          prerelease: ${{ contains(steps.tag.outputs.TAG, '-') }}
          generate_release_notes: true
          files: |
            artifacts/flo-*.tar.gz
            artifacts/flo-*.tar.gz.sha256

  # Points floruntime/homebrew-tap at this release. HOMEBREW_TAP_TOKEN may
  # write to that repo only; until it exists the job says so and passes, so
  # a release never fails on it.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for the tap token
        id: token
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; floruntime/homebrew-tap was not updated."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Checkout the tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: floruntime/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download checksums
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: flo-*
          path: artifacts
          merge-multiple: true

      - name: Determine tag
        if: steps.token.outputs.present == 'true'
        id: tag
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG=$TAG_INPUT; else TAG=${GITHUB_REF#refs/tags/}; fi
          if [[ ! $TAG =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update and push the formula
        if: steps.token.outputs.present == 'true'
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          python3 scripts/homebrew-bump.py homebrew-tap/Formula/flo.rb "$TAG" artifacts
          cd homebrew-tap
          if git diff --quiet; then
            echo "Formula already at $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "flo ${TAG#v}"
          git push
