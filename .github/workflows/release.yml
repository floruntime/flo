name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            platform: linux
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: linux
            target: aarch64-linux
          - os: macos-14
            arch: x86_64
            platform: macos
            target: x86_64-macos
          - os: macos-14
            arch: aarch64
            platform: macos
            target: aarch64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web dashboard
        run: |
          cd web && npm ci && npm run build
          rm -rf ../src/node/dashboard/dist
          mkdir -p ../src/node/dashboard/dist
          cp -r dist/* ../src/node/dashboard/dist/

      - name: Determine version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: zig build --release=safe -Dtarget=${{ matrix.target }} -Dversion=${{ steps.version.outputs.VERSION }}

      - name: Package
        run: |
          ARTIFACT="flo-${{ matrix.arch }}-${{ matrix.platform }}"
          cp zig-out/bin/flo flo
          tar -czf "${ARTIFACT}.tar.gz" flo
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          else
            shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flo-${{ matrix.arch }}-${{ matrix.platform }}
          path: |
            flo-*.tar.gz
            flo-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Flo ${{ steps.tag.outputs.TAG }}
          prerelease: ${{ contains(steps.tag.outputs.TAG, '-') }}
          generate_release_notes: true
          files: |
            artifacts/flo-*.tar.gz
            artifacts/flo-*.tar.gz.sha256
