# THROWAWAY — do not merge. Reproduce the SIGTERM-under-load shutdown flake on
# the GitHub Linux runner (io_uring), where it fires, and capture the per-shard
# TRACE-SRV lines the server logs at SIGTERM plus the per-client TRACE. Runs the
# shutdown e2e test 50x; a failing run prints both traces.
name: loop-shutdown-trace

on:
  push:
    branches:
      - 'loop/shutdown-trace'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - run: mkdir -p src/node/dashboard/dist && touch src/node/dashboard/dist/.keep
      - name: Build the e2e binary (filtered to the shutdown test) and flo
        run: zig build test-e2e -Dtest-filter="SIGTERM under load" --test-timeout 120s 2>&1 | tail -3
      - name: Loop the compiled binary 50x (defeats zig run-step caching)
        run: |
          set +e
          BIN=$(ls -t .zig-cache/o/*/test 2>/dev/null | head -1)
          echo "e2e binary: $BIN"
          [ -x "$BIN" ] || { echo "::error::no e2e test binary"; exit 1; }
          fails=0
          for i in $(seq 1 50); do
            out=$(timeout 120 "$BIN" 2>&1)
            rc=$?
            if [ $rc -ne 0 ] || printf '%s' "$out" | grep -qa "acked nothing"; then
              fails=$((fails+1))
              echo "::group::RUN $i FAILED (rc=$rc)"
              printf '%s\n' "$out" | grep -aE "TRACE|TRACE-SRV|acked nothing|SIGTERM|missing after|server still running" | head -60
              echo "::endgroup::"
            fi
          done
          echo "=== shutdown loop: $fails/50 runs failed ==="
