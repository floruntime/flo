# THROWAWAY — do not merge. Reproduce the SIGTERM-under-load shutdown flake on
# the GitHub Linux runner (io_uring), where it fires, and capture the per-shard
# TRACE-SRV lines the server logs at SIGTERM plus the per-client TRACE. Runs the
# shutdown e2e test 50x; a failing run prints both traces.
name: loop-shutdown-trace

on:
  push:
    branches:
      - 'loop/shutdown-trace'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - run: mkdir -p src/node/dashboard/dist && touch src/node/dashboard/dist/.keep
      - name: Build the e2e binary (filtered to the shutdown test) and flo
        run: zig build test-e2e -Dtest-filter="SIGTERM under load" --test-timeout 120s 2>&1 | tail -3
      - name: Loop the binary under LOAD (parallel) to widen the timing race
        run: |
          # The flake fires under the full e2e's CPU/scheduling pressure, not in
          # isolation (50 isolated runs = 0 failures). Recreate the load by
          # running several copies at once on the 2-4 core runner.
          set +e
          BIN=$(ls -t .zig-cache/o/*/test 2>/dev/null | head -1)
          echo "e2e binary: $BIN"
          [ -x "$BIN" ] || { echo "::error::no e2e test binary"; exit 1; }
          PAR=6; ROUNDS=14; fails=0
          for round in $(seq 1 $ROUNDS); do
            for p in $(seq 1 $PAR); do
              ( timeout 150 "$BIN" > "/tmp/r_${round}_${p}.log" 2>&1; echo $? > "/tmp/rc_${round}_${p}" ) &
            done
            wait
            for p in $(seq 1 $PAR); do
              rc=$(cat "/tmp/rc_${round}_${p}" 2>/dev/null || echo 99)
              if [ "$rc" != "0" ] || grep -qa "acked nothing" "/tmp/r_${round}_${p}.log"; then
                fails=$((fails+1))
                echo "::group::round $round proc $p FAILED (rc=$rc)"
                grep -aE "TRACE|TRACE-SRV|acked nothing|SIGTERM|missing after|server still running" "/tmp/r_${round}_${p}.log" | head -70
                echo "::endgroup::"
              fi
            done
          done
          echo "=== shutdown loop (load): $fails/$((PAR*ROUNDS)) runs failed ==="
