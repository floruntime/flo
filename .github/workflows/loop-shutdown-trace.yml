# THROWAWAY — do not merge. Reproduce the SIGTERM-under-load shutdown flake on
# the GitHub Linux runner (io_uring), where it fires, and capture the per-shard
# TRACE-SRV lines the server logs at SIGTERM plus the per-client TRACE. Runs the
# shutdown e2e test 50x; a failing run prints both traces.
name: loop-shutdown-trace

on:
  push:
    branches:
      - 'loop/shutdown-trace'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - run: mkdir -p src/node/dashboard/dist && touch src/node/dashboard/dist/.keep
      - name: Build the e2e binary (filtered to the shutdown test) and flo
        run: zig build test-e2e -Dtest-filter="SIGTERM under load" --test-timeout 120s 2>&1 | tail -3
      - name: Loop sequentially under background CPU load
        run: |
          # The flake fires under the full e2e's CPU/scheduling pressure, not in
          # isolation (50 isolated runs = 0 failures). The e2e harness locks the
          # checkout, so runs must be sequential; the load comes from busy loops
          # saturating the cores, which widens the acceptor/reactor timing race.
          set +e
          BIN=$(ls -t .zig-cache/o/*/test 2>/dev/null | head -1)
          echo "e2e binary: $BIN"
          [ -x "$BIN" ] || { echo "::error::no e2e test binary"; exit 1; }
          N=$(nproc); echo "cores: $N"; hogs=""
          for c in $(seq 1 "$N"); do ( timeout 900 bash -c 'while :; do :; done' ) & hogs="$hogs $!"; done
          fails=0; RUNS=80
          for i in $(seq 1 $RUNS); do
            out=$(timeout 150 "$BIN" 2>&1); rc=$?
            if [ $rc -ne 0 ] || printf '%s' "$out" | grep -qa "acked nothing"; then
              fails=$((fails+1))
              echo "::group::RUN $i FAILED (rc=$rc)"
              printf '%s\n' "$out" | grep -aE "TRACE|TRACE-SRV|acked nothing|SIGTERM|missing after|server still running|another e2e run holds" | head -70
              echo "::endgroup::"
            fi
          done
          for h in $hogs; do kill "$h" 2>/dev/null; done
          echo "=== shutdown loop (cpu load): $fails/$RUNS runs failed ==="
