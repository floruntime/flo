name: CI

on:
  pull_request:
    branches: [dev, main, 'feat/*']
  push:
    branches: [dev, main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Never cancel on
# dev/main — those runs are the record of what the branch actually did.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

jobs:
  # The console is compiled into the Zig binary, so a TypeScript error here
  # breaks the release build — `npm run build` runs `tsc -b` first.
  web:
    name: Web console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build console
        working-directory: web
        run: |
          npm ci
          npm run build

      # Handed to the Zig jobs so they embed the real console rather than
      # rebuilding it three times.
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: web/dist
          retention-days: 1

  build:
    name: Build
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: src/node/dashboard/dist

      # Before the build, which generates the gitignored dashboard assets.
      - name: Format
        run: zig fmt --check src tests build.zig

      - name: Build
        run: zig build

      # The build gzips each dashboard asset into <asset>.<hash of its
      # bytes>.gz. Every copy must be its source's, including after a source
      # changes under an older mtime, as a checkout can leave it.
      - name: Dashboard copies match their sources
        run: |
          check() {
            n=0
            for gz in $(find src/node/dashboard/dist -name '*.gz'); do
              src=${gz%.*.gz}
              gunzip -c "$gz" | cmp -s - "$src" || { echo "::error::$gz is not a copy of $src"; exit 1; }
              n=$((n+1))
            done
            [ "$n" -gt 0 ] || { echo "::error::no compressed dashboard assets"; exit 1; }
          }
          check
          printf '<!-- changed -->\n' >> src/node/dashboard/dist/index.html
          touch -t 200001010000 src/node/dashboard/dist/index.html
          zig build
          check
          [ "$(find src/node/dashboard/dist -name 'index.html.*.gz' | wc -l)" -eq 1 ] || { echo "::error::the old index.html copy was kept"; exit 1; }
          # A killed build's half-written copy is neither embedded nor kept.
          stray=src/node/dashboard/dist/index.html.0123456789abcdef.gz.tmp
          echo partial > "$stray"
          zig build
          [ ! -e "$stray" ] || { echo "::error::a stray .gz.tmp was kept"; exit 1; }
          ! grep -q 'gz\.tmp' src/node/dashboard/assets.zig || { echo "::error::a .gz.tmp was embedded"; exit 1; }
          check

      # Nothing else compiles the benches; this keeps them building.
      - name: Build the benches
        run: zig build bench

      # install.sh and the packages' preinstall each check the CPU floor;
      # their flag lists must not drift apart. (The release compares the
      # Homebrew formula's too.)
      - name: The CPU floor lists match
        run: scripts/check-cpu-floor.sh

      # CI otherwise runs only unfiltered, which never exercises the filter
      # checks: a filtered step must compile exactly what the build predicted,
      # and a filter that matches nothing must fail the step.
      - name: Filtered tests
        run: zig build test-unit -Dtest-filter=kv
      - name: A filter that matches nothing fails
        run: |
          if zig build test-unit -Dtest-filter=no_test_is_named_this; then
            echo "::error::a test filter that matched nothing passed"; exit 1
          fi

  test:
    name: ${{ matrix.step }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      # Report every suite's result — one failure should not hide the others.
      fail-fast: false
      matrix:
        # A hung test is killed at its step's limit and fails by name; the
        # job's timeout-minutes stays as the backstop. Each limit is about
        # three times the slowest test measured locally (unit: a VOPR swarm,
        # 10-20 s), so a slower runner doesn't flake.
        #
        # `skips` is how many tests skip on Linux. A test that skips passes
        # silently, so a count off by one fails the step: update it, and the
        # list here, only for a skip you meant.
        include:
          - step: test-unit
            test_timeout: 90s
            skips: 0
          - step: test-integration
            test_timeout: 60s
            skips: 0
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: src/node/dashboard/dist

      - name: zig build ${{ matrix.step }}
        env:
          STEP: ${{ matrix.step }}
          TEST_TIMEOUT: ${{ matrix.test_timeout }}
          SKIPS: ${{ matrix.skips }}
        run: |
          set -o pipefail
          zig build "$STEP" --test-timeout "$TEST_TIMEOUT" --summary all 2>&1 | tee build.log
          summary=$(grep '^Build Summary:' build.log | tail -1)
          skipped=$(echo "$summary" | sed -n -E 's/.*[(, ]([0-9]+) skipped.*/\1/p')
          if [ "${skipped:-0}" != "$SKIPS" ]; then
            echo "::error::${skipped:-0} tests skipped, expected $SKIPS ($summary)"; exit 1
          fi
        timeout-minutes: 30

  # The e2e suite runs as shards, whole files balanced on the per-file times
  # in tests/e2e/shard_times.tsv (scripts/e2e-shard-times.sh refreshes them).
  # The `test-e2e` job below checks that the shards add up to the whole suite.
  e2e-shard:
    name: test-e2e ${{ matrix.shard }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The suite drives a real server, which embeds the console.
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: src/node/dashboard/dist

      # A hung test is killed at --test-timeout and fails by name, about three
      # times the slowest test (list paging, 34 s on CI). The halt tests drive
      # a fault only a -Dtest-faults build carries; without it they skip, and
      # the skip count in test-e2e catches it.
      - name: zig build test-e2e -De2e-shard=${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
          # The e2e runner appends each test's time here (tests/e2e/helpers/test_runner.zig).
          FLO_TEST_TIMES: ${{ runner.temp }}/shard/test-times.tsv
          OUT: ${{ runner.temp }}/shard
        run: |
          set +e -o pipefail
          mkdir -p "$OUT"
          zig build test-e2e -De2e-shard="$SHARD" -Dtest-faults=true --test-timeout 300s --summary all 2>&1 | tee build.log
          status=$?
          grep '^Build Summary:' build.log | tail -1 > "$OUT/summary.txt"
          exit $status
        timeout-minutes: 30
      # What test-e2e sums: the build's count of this shard's tests (written
      # at configure time, so present even when the run fails), the run's
      # summary line, and each test's time.
      - name: Shard report
        if: always()
        env:
          OUT: ${{ runner.temp }}/shard
        run: |
          mkdir -p "$OUT"
          cp zig-out/e2e-shard.txt "$OUT/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-times-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: ignore

  # The required check. It fails unless every shard passed, the shards are
  # exactly 1..N of one N, their tests add up to the whole suite, and their
  # skips add up to `SKIPS`.
  test-e2e:
    name: test-e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-test-times-*
          path: shards
      - name: Check the shards add up
        env:
          RESULT: ${{ needs.e2e-shard.result }}
          # How many tests skip on Linux. A test that skips passes silently,
          # so a count off by one fails here: update it only for a skip you
          # meant.
          SKIPS: 0
        run: |
          fail() { echo "::error::$*"; bad=1; }
          bad=0
          [ "$RESULT" = success ] || fail "a shard did not pass ($RESULT)"
          n= ; total= ; sum_declared=0 ; sum_skipped=0 ; seen=
          for d in shards/*/; do
            info=$(cat "$d/e2e-shard.txt" 2>/dev/null) || { fail "$d has no shard report (it never configured)"; continue; }
            i=$(echo "$info" | sed -E 's/^shard=([0-9]+)\/.*/\1/')
            of=$(echo "$info" | sed -E 's/^shard=[0-9]+\/([0-9]+) .*/\1/')
            declared=$(echo "$info" | sed -E 's/.* declared=([0-9]+).*/\1/')
            t=$(echo "$info" | sed -E 's/.* total=([0-9]+).*/\1/')
            summary=$(cat "$d/summary.txt" 2>/dev/null || true)
            ran=$(echo "$summary" | sed -n -E 's/.*; [0-9]+\/([0-9]+) tests passed.*/\1/p')
            skipped=$(echo "$summary" | sed -n -E 's/.*[(, ]([0-9]+) skipped.*/\1/p')
            echo "shard $i/$of: declared $declared of $t; ${summary:-no summary}"
            [ -z "$n" ] && n=$of && total=$t
            [ "$of" = "$n" ] || fail "shard $i says N=$of, another says N=$n"
            [ "$t" = "$total" ] || fail "shard $i says the suite has $t tests, another says $total"
            case " $seen " in *" $i "*) fail "shard $i ran twice";; esac
            seen="$seen $i"
            # The root's own tests and the sentinel run in every shard on top.
            [ "${ran:-0}" -ge "$declared" ] || fail "shard $i ran ${ran:-0} tests, fewer than its $declared"
            sum_declared=$((sum_declared + declared))
            sum_skipped=$((sum_skipped + ${skipped:-0}))
          done
          [ -n "$n" ] || fail "no shard reported"
          for i in $(seq 1 "${n:-0}"); do
            case " $seen " in *" $i "*) ;; *) fail "shard $i/$n did not report";; esac
          done
          [ "$sum_declared" = "${total:-x}" ] || fail "the shards hold $sum_declared tests, the suite $total"
          [ "$sum_skipped" = "$SKIPS" ] || fail "$sum_skipped tests skipped, expected $SKIPS"
          exit $bad
      - name: Slowest tests
        if: always()
        run: |
          times=$(find shards -name test-times.tsv)
          [ -n "$times" ] || exit 0
          {
            echo '### Slowest e2e tests (ms)'; echo '```'
            cat $times | sort -rn | head -20
            echo '```'; echo '### e2e time per shard (s)'; echo '```'
            for f in $times; do printf '%s\t%s\n' "$(awk -F'\t' '{ s += $1 } END { printf "%d", s / 1000 }' "$f")" "$(cat "$(dirname "$f")/e2e-shard.txt" 2>/dev/null | cut -d' ' -f1)"; done
            echo '```'; echo '### e2e time per file (ms)'; echo '```'
            cat $times | awk -F'\t' '{ f = $2; sub(/\.test\..*/, "", f); t[f] += $1; n[f]++ } END { for (f in t) printf "%d\t%d\t%s\n", t[f], n[f], f }' | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The simulator runs ReleaseSafe (-Drelease selects it) so any UB in the
  # unit under test traps instead of silently corrupting a run. Seeds 1-20
  # are the known-green set; the wider swarm finds real bugs and is run
  # by hand until those are fixed.
  vopr:
    name: vopr swarm (20 seeds, ReleaseSafe)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: src/node/dashboard/dist
      - name: Build (ReleaseSafe)
        run: zig build -Drelease
      - name: The binary carries no test faults
        # A -Dtest-faults build halts a shard, or crashes it in apply, on a
        # kv set of a key with this prefix.
        run: |
          if grep -qa 'flo-test-fault-' zig-out/bin/flo; then
            echo "::error::a build without -Dtest-faults carries the test faults"; exit 1
          fi
      - name: Release allocator
        # main roots every allocation in libc's allocator outside Debug; a
        # toolchain bump must not quietly swap in Zig's slower default.
        run: ./zig-out/bin/flo version --verbose | tee /dev/stderr | grep -qF 'alloc=libc'
      - name: The binary says it carries no test faults
        run: |
          if ./zig-out/bin/flo version --verbose | grep -qF 'test-faults'; then
            echo "::error::a build without -Dtest-faults says it carries them"; exit 1
          fi
      - name: Swarm
        run: ./zig-out/bin/vopr --iterations=20 --seed=1 --jobs=4 --seed-timeout=120 --out-dir=/tmp/vopr
        timeout-minutes: 20
      - name: Swarm with lost disks
        # Crashes that lose a disk or its hard state, up to two nodes at once:
        # the lost-log guard's slice.
        run: ./zig-out/bin/vopr --iterations=20 --seed=1 --jobs=4 --wipes --seed-timeout=120 --out-dir=/tmp/vopr-wipes
        timeout-minutes: 20
      - name: Swarm with an outsider
        # A node with the cluster secret but no seat sends forged votes and
        # appends under its own id; none may be taken.
        run: ./zig-out/bin/vopr --iterations=20 --seed=1 --jobs=4 --byzantine --seed-timeout=120 --out-dir=/tmp/vopr-byzantine
        timeout-minutes: 20
      - name: Swarm with a halting entry
        # One op's entry fails to apply on every node: each node halts at
        # the same entry, and the group still elects and changes members.
        run: ./zig-out/bin/vopr --iterations=20 --seed=1 --jobs=4 --halts --seed-timeout=120 --out-dir=/tmp/vopr-halts
        timeout-minutes: 20
      - name: Regression seeds stay green
        # Each seed reaches a bug whose fix landed; it fails if the fix is
        # undone. A seed that fails here is a regression, not a flake.
        run: |
          shopt -s nullglob
          seeds=(src/vopr/seeds/*.json)
          [ ${#seeds[@]} -gt 0 ] || { echo "::error::no regression seeds found"; exit 1; }
          for seed in "${seeds[@]}"; do
            timeout 300 ./zig-out/bin/vopr --scenario-in="$seed" > /tmp/seed.log 2>&1 || {
              tail -40 /tmp/seed.log; echo "::error::$seed failed"; exit 1; }
          done
        timeout-minutes: 15
      - name: Pins still fail by design
        # Each pin is the acceptance test for a product fix; a pin going
        # green means that fix landed and the pin should be retired here.
        # A pin may be a genuine hang, so every pin runs under a timeout —
        # a kill (exit 124) still counts as failing by design.
        # The README's table names every pin, so a pin deleted or added
        # without it fails here rather than leaving the loop with less to do.
        run: |
          shopt -s nullglob
          files=$(for f in src/vopr/pins/*.json; do basename "$f"; done | sort)
          listed=$({ grep -oE '^\| `?[A-Za-z0-9._-]+\.json`? \|' src/vopr/pins/README.md || true; } | tr -d '|` ' | sort)
          if [ "$files" != "$listed" ]; then
            echo "::error::src/vopr/pins holds [$(echo $files)] but its README lists [$(echo $listed)]"; exit 1
          fi
          [ -n "$files" ] || echo "no pins: the README lists none, and none exist"
          for pin in src/vopr/pins/*.json; do
            if timeout 300 ./zig-out/bin/vopr --scenario-in="$pin" > /dev/null 2>&1; then
              echo "::error::$pin passed — its product fix landed; retire the pin"; exit 1
            fi
          done
        timeout-minutes: 25
