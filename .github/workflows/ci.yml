name: CI

on:
  pull_request:
    branches: [dev, main, 'feat/*']
  push:
    branches: [dev, main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Never cancel on
# dev/main — those runs are the record of what the branch actually did.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

jobs:
  # The console is compiled into the Zig binary, so a TypeScript error here
  # breaks the release build — `npm run build` runs `tsc -b` first.
  web:
    name: Web console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build console
        working-directory: web
        run: |
          npm ci
          npm run build

      # Handed to the Zig jobs so they embed the real console rather than
      # rebuilding it three times.
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: web/dist
          retention-days: 1

  build:
    name: Build
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: src/node/dashboard/dist

      # Before the build, which generates the gitignored dashboard assets.
      - name: Format
        run: zig fmt --check src tests build.zig

      - name: Build
        run: zig build

      # The build gzips each dashboard asset into <asset>.<hash of its
      # bytes>.gz. Every copy must be its source's, including after a source
      # changes under an older mtime, as a checkout can leave it.
      - name: Dashboard copies match their sources
        run: |
          check() {
            n=0
            for gz in $(find src/node/dashboard/dist -name '*.gz'); do
              src=${gz%.*.gz}
              gunzip -c "$gz" | cmp -s - "$src" || { echo "::error::$gz is not a copy of $src"; exit 1; }
              n=$((n+1))
            done
            [ "$n" -gt 0 ] || { echo "::error::no compressed dashboard assets"; exit 1; }
          }
          check
          printf '<!-- changed -->\n' >> src/node/dashboard/dist/index.html
          touch -t 200001010000 src/node/dashboard/dist/index.html
          zig build
          check
          [ "$(find src/node/dashboard/dist -name 'index.html.*.gz' | wc -l)" -eq 1 ] || { echo "::error::the old index.html copy was kept"; exit 1; }
          # A killed build's half-written copy is neither embedded nor kept.
          stray=src/node/dashboard/dist/index.html.0123456789abcdef.gz.tmp
          echo partial > "$stray"
          zig build
          [ ! -e "$stray" ] || { echo "::error::a stray .gz.tmp was kept"; exit 1; }
          ! grep -q 'gz\.tmp' src/node/dashboard/assets.zig || { echo "::error::a .gz.tmp was embedded"; exit 1; }
          check

      # Nothing else compiles the benches; this keeps them building.
      - name: Build the benches
        run: zig build bench

      # install.sh and the packages' preinstall each check the CPU floor;
      # their flag lists must not drift apart.
      - name: The CPU floor lists match
        run: |
          lists() { grep -oE '(x86_64|aarch64)\) +CPU_KEY="[A-Za-z]+"; +NEEDED="[^"]*"' "$1" | tr -s ' '; }
          a=$(lists scripts/install.sh); b=$(lists packaging/scripts/preinstall.sh)
          if [ -z "$a" ] || [ "$(printf '%s\n' "$a" | wc -l)" -ne 2 ] || [ "$a" != "$b" ]; then
            printf 'install.sh:\n%s\npreinstall.sh:\n%s\n' "$a" "$b"
            echo "::error::the CPU floor flag lists in scripts/install.sh and packaging/scripts/preinstall.sh differ"; exit 1
          fi

      # CI otherwise runs only unfiltered, which never exercises the filter
      # checks: a filtered step must compile exactly what the build predicted,
      # and a filter that matches nothing must fail the step.
      - name: Filtered tests
        run: zig build test-unit -Dtest-filter=kv
      - name: A filter that matches nothing fails
        run: |
          if zig build test-unit -Dtest-filter=no_test_is_named_this; then
            echo "::error::a test filter that matched nothing passed"; exit 1
          fi

  test:
    name: ${{ matrix.step }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      # Report every suite's result — one failure should not hide the others.
      fail-fast: false
      matrix:
        # A hung test is killed at its step's limit and fails by name; the
        # job's timeout-minutes stays as the backstop. Each limit is about
        # three times the slowest test measured locally (unit: a VOPR swarm,
        # 10-20 s; e2e: list paging and the namespace limit, 40-70 s), so a
        # slower runner doesn't flake.
        include:
          - step: test-unit
            test_timeout: 90s
          - step: test-integration
            test_timeout: 60s
          - step: test-e2e
            test_timeout: 300s
            # The halt tests drive a fault only a test build carries.
            flags: -Dtest-faults=true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # The e2e suite drives a real server, which embeds the console.
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: src/node/dashboard/dist

      - name: zig build ${{ matrix.step }}
        env:
          STEP: ${{ matrix.step }}
          TEST_TIMEOUT: ${{ matrix.test_timeout }}
          FLAGS: ${{ matrix.flags }}
        run: zig build "$STEP" --test-timeout "$TEST_TIMEOUT" $FLAGS
        timeout-minutes: 30

  # The simulator runs ReleaseSafe (-Drelease selects it) so any UB in the
  # unit under test traps instead of silently corrupting a run. Seeds 1-20
  # are the known-green set; the wider swarm finds real bugs and is run
  # by hand until those are fixed.
  vopr:
    name: vopr swarm (20 seeds, ReleaseSafe)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: src/node/dashboard/dist
      - name: Build (ReleaseSafe)
        run: zig build -Drelease
      - name: Release allocator
        # main roots every allocation in libc's allocator outside Debug; a
        # toolchain bump must not quietly swap in Zig's slower default.
        run: ./zig-out/bin/flo version --verbose | tee /dev/stderr | grep -qF 'alloc=libc'
      - name: Swarm
        run: ./zig-out/bin/vopr --iterations=20 --seed=1 --jobs=4 --seed-timeout=120 --out-dir=/tmp/vopr
        timeout-minutes: 20
      - name: Swarm with lost disks
        # Crashes that lose a disk or its hard state, up to two nodes at once:
        # the lost-log guard's slice.
        run: ./zig-out/bin/vopr --iterations=20 --seed=1 --jobs=4 --wipes --seed-timeout=120 --out-dir=/tmp/vopr-wipes
        timeout-minutes: 20
      - name: Swarm with an outsider
        # A node with the cluster secret but no seat sends forged votes and
        # appends under its own id; none may be taken.
        run: ./zig-out/bin/vopr --iterations=20 --seed=1 --jobs=4 --byzantine --seed-timeout=120 --out-dir=/tmp/vopr-byzantine
        timeout-minutes: 20
      - name: Swarm with a halting entry
        # One op's entry fails to apply on every node: each node halts at
        # the same entry, and the group still elects and changes members.
        run: ./zig-out/bin/vopr --iterations=20 --seed=1 --jobs=4 --halts --seed-timeout=120 --out-dir=/tmp/vopr-halts
        timeout-minutes: 20
      - name: Regression seeds stay green
        # Each seed reaches a bug whose fix landed; it fails if the fix is
        # undone. A seed that fails here is a regression, not a flake.
        run: |
          shopt -s nullglob
          seeds=(src/vopr/seeds/*.json)
          [ ${#seeds[@]} -gt 0 ] || { echo "::error::no regression seeds found"; exit 1; }
          for seed in "${seeds[@]}"; do
            timeout 300 ./zig-out/bin/vopr --scenario-in="$seed" > /tmp/seed.log 2>&1 || {
              tail -40 /tmp/seed.log; echo "::error::$seed failed"; exit 1; }
          done
        timeout-minutes: 15
      - name: Pins still fail by design
        # Each pin is the acceptance test for a product fix; a pin going
        # green means that fix landed and the pin should be retired here.
        # A pin may be a genuine hang, so every pin runs under a timeout —
        # a kill (exit 124) still counts as failing by design.
        run: |
          shopt -s nullglob
          for pin in src/vopr/pins/*.json; do
            if timeout 300 ./zig-out/bin/vopr --scenario-in="$pin" > /dev/null 2>&1; then
              echo "::error::$pin passed — its product fix landed; retire the pin"; exit 1
            fi
          done
        timeout-minutes: 25
