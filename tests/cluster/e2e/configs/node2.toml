# Flo Cluster Node 2 — local e2e testing
# Listen: 4451, Metrics: 4452, Dashboard: 4453, Peer port: 4951

[server]
port = 4451
bind = "127.0.0.1"
data_dir = "/tmp/flo-cluster-test/node2"
# A cluster replicates one shard for now.
shards = 1

[storage]
durability = "async_flush"

[logging]
level = "info"

[metrics]
enabled = true
# port = 0 → auto: 4451 + 1 = 4452

[dashboard]
enabled = true
bind = "127.0.0.1"
# port = 0 → auto: 4451 + 2 = 4453

[cluster]
# Joins the first member; the leader adds this node to the group.
node_id = 2
secret = "local-cluster-test-secret"
seeds = ["127.0.0.1:4941"]
